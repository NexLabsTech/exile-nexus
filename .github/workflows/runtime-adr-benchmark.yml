name: EXN Runtime ADR Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/frontend-runtime/**'
      - '.github/workflows/runtime-adr-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: exn-runtime-adr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Frontend benchmark (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [astro, vite]
    steps:
      - name: Checkout synthetic experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install versioned dependencies with temporary lock
        working-directory: experiments/frontend-runtime/${{ matrix.candidate }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm ls --depth=0
      - name: Typecheck and measure static build
        working-directory: experiments/frontend-runtime/${{ matrix.candidate }}
        run: |
          set -euo pipefail
          node --version
          npm run check
          start=$(date +%s%3N)
          npm run build
          end=$(date +%s%3N)
          test -s dist/index.html
          bytes=$(find dist -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          files=$(find dist -type f | wc -l)
          echo "Candidate: ${{ matrix.candidate }}"
          echo "Build milliseconds: $((end-start))"
          echo "Total generated bytes: $bytes"
          echo "Generated files: $files"
          {
            echo "## Runtime ADR measurement: ${{ matrix.candidate }}"
            echo "HEAD: ${GITHUB_SHA}"
            echo "Node: $(node --version)"
            echo "Typecheck: PASS"
            echo "Build: PASS"
            echo "Build duration (ms): $((end-start))"
            echo "Generated static files: $files"
            echo "Generated bytes: $bytes"
          } >> "$GITHUB_STEP_SUMMARY"
