name: EXN WO13 lockfile preparation (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/wo13-lock-bootstrap/**'
      - '.github/workflows/wo13-lock-bootstrap.yml'

permissions:
  contents: read

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile
        working-directory: experiments/wo13-lock-bootstrap
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs');const crypto=require('crypto');const p=fs.readFileSync('package-lock.json');const s=p.toString('base64');console.log('EXN_LOCK_SHA256 '+crypto.createHash('sha256').update(p).digest('hex'));for(let i=0;i<s.length;i+=5000)console.log('EXN_LOCK_PART '+String(i/5000).padStart(5,'0')+' '+s.slice(i,i+5000));console.log('EXN_LOCK_END '+Math.ceil(s.length/5000))"
