name: EXN WO18 English localization and content contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/wo18-localization.yml'

permissions:
  contents: read

concurrency:
  group: exn-wo18-i18n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  english-contract:
    name: English catalog and hardcoded copy gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate catalog and negative tests
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run i18n:verify -- --output=i18n-reports/english-coverage.json
          npm run build
          npm run seo:verify -- --output=i18n-reports/seo-preview-report.json
          npm audit --audit-level=high
      - name: Publish read-only locale and SEO evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exn-m01-wo-008-english-evidence
          path: apps/web/i18n-reports/
          retention-days: 7
          if-no-files-found: warn
