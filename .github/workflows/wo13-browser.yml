name: EXN WO13 responsive UI screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/wo13-browser.yml'
      - 'design/tokens.css'

permissions:
  contents: read

concurrency:
  group: exn-wo13-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Responsive Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, typecheck, unit and static build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Deep-link, keyboard and responsive screenshot E2E
        run: npm run test:e2e
      - name: Archive screenshot and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exn-m01-wo-003-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: warn
